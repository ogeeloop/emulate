name: Ogee Loop image

# Fork-only: builds this branch (upstream main plus patches not yet released
# upstream) and publishes it to ghcr.io/ogeeloop/emulate. It is not part of any
# upstream pull request. Delete the branch once upstream ships the patches.

on:
  push:
    branches: [ogeeloop/image]

concurrency:
  group: ogeeloop-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ghcr.io/ogeeloop/emulate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine image tags
        id: tags
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/ogeeloop/emulate"
          echo "tags=${IMAGE}:${BASE}-ogeeloop.${RUN_NUMBER},${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Summarize
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "$TAGS" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
